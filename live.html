<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>ARVIN · Live scenes</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#f5f5f7;--ink:#1d1d1f;--mute:#86868b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,-apple-system,system-ui;color:var(--ink);-webkit-font-smoothing:antialiased}
header{background:#000;color:#f5f5f7;text-align:center;padding:64px 20px 48px}header small{font-size:15px;font-weight:600}
header h1{font-size:clamp(42px,8vw,76px);font-weight:700;letter-spacing:-.045em;margin:8px 0 10px;line-height:1}header p{color:#86868b;font-size:17px;margin:0}
.ctl{position:sticky;top:0;z-index:5;background:rgba(245,245,247,.82);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border-bottom:1px solid rgba(0,0,0,.07);padding:14px 20px}
.ctl .in{max-width:980px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
.time{display:flex;align-items:center;gap:12px;flex:1 1 320px}.time b{font-weight:200;font-size:34px;letter-spacing:-.03em;min-width:104px;font-variant-numeric:tabular-nums}
input[type=range]{flex:1;accent-color:#1d1d1f}
.seg{display:flex;background:rgba(0,0,0,.06);border-radius:999px;padding:3px}.seg button{all:unset;cursor:pointer;font-size:13.5px;font-weight:500;padding:7px 13px;border-radius:999px}.seg button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12);font-weight:600}
.btn{all:unset;cursor:pointer;font-size:13.5px;font-weight:600;padding:9px 16px;border-radius:999px;border:1px solid rgba(0,0,0,.15)}.btn.on{background:#0071e3;color:#fff;border-color:#0071e3}
.status{font-size:13px;color:var(--mute);width:100%}
.grid{max-width:980px;margin:28px auto 80px;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px 18px}
.c b{display:block;font-size:14px;font-weight:600;margin:10px 4px 0}
.card{aspect-ratio:6/7;border-radius:30px;overflow:hidden;position:relative;box-shadow:0 20px 40px -24px rgba(0,0,0,.4)}.card svg{width:100%;height:100%;display:block}
.pill{position:absolute;top:16px;left:16px;font-size:12.5px;color:#fff;padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
/* live scene engine */
svg.live{--sx:1;--sy:1;--so:.22;--co:.3;--wr:0deg;--wl:1;--wo:.12;--tint:#fff;--to:0;--gl:#ffe2b0;--go:.22;--lp:0;--fg:0;--cl:0;--rn:0;--sn:0;--stm:.3}
svg.live .shs,svg.live .shc,svg.live .win,svg.live .tint,svg.live .glow,svg.live .lamp,svg.live .fog,svg.live .clouds,svg.live .rain,svg.live .snow{transition:transform 1.4s ease,opacity 1.4s ease,fill 1.4s ease}
.shs{transform:translate(calc(var(--sx)*22px),calc(var(--sy)*26px));opacity:var(--so)}
.shc{transform:translate(calc(var(--sx)*3px),calc(var(--sy)*4px));opacity:var(--co)}
.win{transform-origin:300px -100px;transform:rotate(var(--wr)) scaleY(var(--wl));opacity:var(--wo)}
.sway{transform-origin:300px 0;animation:sway 9s ease-in-out infinite alternate}@keyframes sway{to{transform:translateX(7px) rotate(.5deg)}}
.leafsh{transform-origin:540px 0;animation:leaf 3.6s ease-in-out infinite alternate}@keyframes leaf{to{transform:rotate(4deg) translateX(4px)}}
.tint{fill:var(--tint);opacity:var(--to);mix-blend-mode:multiply}
.glow{fill:var(--gl);opacity:var(--go)}
.lamp{opacity:var(--lp);mix-blend-mode:screen}
.fog{opacity:var(--fg)}
.clouds{opacity:var(--cl)}.cl1{animation:drift 38s linear infinite}.cl2{animation:drift 52s linear infinite reverse}@keyframes drift{from{transform:translateX(-520px)}to{transform:translateX(720px)}}
.rain{opacity:var(--rn)}.drop{animation-name:fall;animation-timing-function:linear;animation-iteration-count:infinite}@keyframes fall{from{transform:translateY(-90px)}to{transform:translateY(790px)}}
.snow{opacity:var(--sn)}.flake{animation-name:snowf;animation-timing-function:linear;animation-iteration-count:infinite}@keyframes snowf{from{transform:translate(0,-20px)}to{transform:translate(50px,730px)}}
.steam{animation:steam 3.6s ease-in-out infinite}@keyframes steam{0%{opacity:0;transform:translateY(10px) scaleY(.8)}40%{opacity:var(--stm)}100%{opacity:0;transform:translateY(-34px) scaleY(1.1)}}
@media (prefers-reduced-motion:reduce){.sway,.leafsh,.cl1,.cl2,.drop,.flake,.steam{animation:none!important}}

pacity=".35" filter="url(#rd5)" style="animation-delay:-1.21s;animation-duration:6.50s"/><circle class="flake" cx="496" cy="0" r="2" fill="#5a6a80" opacity=".35" filter="url(#rd5)" style="animation-delay:-2.12s;animation-duration:7.00s"/><circle class="flake" cx="549" cy="0" r="3" fill="#5a6a80" opacity=".35" filter="url(#rd5)" style="animation-delay:-3.03s;animation-duration:7.50s"/></g><g class="clouds"><ellipse class="cl1" cx="100" cy="250" rx="260" ry="170" fill="#2a3240" filter="url(#bb5)"/><ellipse class="cl2" cx="500" cy="520" rx="240" ry="150" fill="#2a3240" filter="url(#bb5)"/></g><rect class="tint" width="600" height="700"/><ellipse class="glow" cx="470" cy="120" rx="300" ry="230" filter="url(#bb5)"/><rect class="lamp" width="600" height="700" fill="url(#lp5)"/><rect class="fog" width="600" height="700" fill="#eef0f2"/><rect width="600" height="700" filter="url(#n5)"/></svg><span class="pill">Next · Tue 6:00</span></div><b>Tutoring</b></div></div><script>
(function(){
const svgs=[...document.querySelectorAll('svg.live')];
let S={h:new Date().getHours()+new Date().getMinutes()/60,wx:'clear',rise:8.5,set:17.35,live:true};
const lerp=(a,b,t)=>a+(b-a)*t, cl=v=>Math.max(0,Math.min(1,v));
function state(h,wx){
  const r=S.rise,s=S.set,f=(h-r)/(s-r),day=f>=0&&f<=1,e=day?Math.sin(Math.PI*f):0;
  let v={sx:0,sy:.6,so:.06,co:.18,wr:0,wl:1,wo:0,tint:'#141a33',to:.68,gl:'#ffe2b0',go:0,lp:1,fg:0,cl:0,rn:0,sn:0,stm:.45,blur:16,wblur:9};
  if(day){
    const L=1.7-1.1*e; v.sx=(1-2*f)*L*1.3; v.sy=.35+L*.55; v.so=.16+.12*e; v.co=.3; v.wr=((f-.5)*44).toFixed(1)+'deg'; v.wl=.8+(1-e)*.7; v.wo=.10+.06*e;
    v.lp=0; v.stm=.3; v.blur=8+ (1-e)*8; v.go=.12+.2*e;
    if(f<.12){v.tint='#ffb27c';v.to=.24*(1-f/.12)+.06;v.gl='#ffc78f'}
    else if(f>.82){const t=(f-.82)/.18;v.tint='#ff9a58';v.to=.08+.26*t;v.gl='#ffb070'}
    else{v.tint='#fff1dc';v.to=.05;v.gl='#fff0d0'}
  }else{
    const toSet=h-s, toRise=r-h; // twilight within 1h
    if(toSet>0&&toSet<1){const t=toSet;v.tint='#5f6aa8';v.to=lerp(.3,.5,t);v.lp=lerp(.35,.85,t)}
    else if(toRise>0&&toRise<1){const t=1-toRise;v.tint='#6a6fa8';v.to=lerp(.5,.32,t);v.lp=lerp(.85,.3,t)}
    v.sx=.9;v.sy=1.1;v.so=.34*v.lp+.04;v.blur=10;
  }
  if(wx==='clouds'){v.so*=.45;v.wo*=.25;v.blur+=10;v.cl=day?.16:.1;v.go*=.4;if(day){v.tint='#c3c9d3';v.to=Math.max(v.to,.16)}}
  if(wx==='rain'){v.so*=.35;v.wo=0;v.blur+=12;v.cl=.2;v.rn=day?.32:.22;v.go=0;if(day){v.tint='#93a3b8';v.to=.26}v.stm=.5}
  if(wx==='snow'){v.so*=.4;v.wo*=.2;v.blur+=10;v.sn=1;v.go*=.3;if(day){v.tint='#dbe3ee';v.to=.14;v.fg=.1}v.stm=.55}
  if(wx==='fog'){v.so*=.3;v.wo*=.15;v.blur+=14;v.fg=day?.38:.18;v.go*=.2;if(day){v.tint='#e3e6ea';v.to=.1}}
  return v;
}
function apply(){
  const v=state(S.h,S.wx);
  for(const s of svgs){
    for(const k of ['sx','sy','so','co','wl','wo','to','go','lp','fg','cl','rn','sn','stm'])s.style.setProperty('--'+k,(+v[k]).toFixed(3));
    s.style.setProperty('--wr',v.wr);s.style.setProperty('--tint',v.tint);s.style.setProperty('--gl',v.gl);
    s.querySelectorAll('.sblur').forEach(b=>b.setAttribute('stdDeviation',v.blur.toFixed(1)));
  }
  const hh=Math.floor(S.h)%24,mm=Math.round((S.h%1)*60)%60;
  document.getElementById('tlabel').textContent=((hh%12)||12)+':'+String(mm).padStart(2,'0')+(hh<12?' AM':' PM');
  document.getElementById('slider').value=S.h;
  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.w===S.wx));
}
const MAP=c=>c<=1?'clear':c<=3?'clouds':c<=48?'fog':(c>=71&&c<=77)||c===85||c===86?'snow':'rain';
async function live(){
  S.live=true;document.getElementById('liveBtn').classList.add('on');
  const d=new Date();S.h=d.getHours()+d.getMinutes()/60;apply();
  try{
    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=49.28&longitude=-122.79&current=weather_code,temperature_2m&daily=sunrise,sunset&timezone=America%2FVancouver&forecast_days=1');
    const j=await r.json();if(!S.live)return;const c=j.current.weather_code;S.wx=MAP(c);
    const t=x=>{const m=x.match(/T(\d\d):(\d\d)/);return +m[1]+ +m[2]/60};S.rise=t(j.daily.sunrise[0]);S.set=t(j.daily.sunset[0]);
    document.getElementById('status').textContent=`Live · Coquitlam now: ${S.wx}, ${Math.round(j.current.temperature_2m)}° · sunrise ${j.daily.sunrise[0].slice(11)} · sunset ${j.daily.sunset[0].slice(11)}`;
  }catch(e){document.getElementById('status').textContent='Live · using your time (weather unavailable offline)'}
  apply();
}
function manual(){S.live=false;document.getElementById('liveBtn').classList.remove('on');document.getElementById('status').textContent='Preview mode · drag the time or pick weather. Tap Live to go back.'}
document.getElementById('slider').oninput=e=>{manual();S.h=+e.target.value;apply()};
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{manual();S.wx=b.dataset.w;apply()});
document.getElementById('liveBtn').onclick=live;
let playing=null;document.getElementById('playBtn').onclick=()=>{manual();if(playing){clearInterval(playing);playing=null;return}S.h=5;playing=setInterval(()=>{S.h+=.25;if(S.h>23.75){clearInterval(playing);playing=null}apply()},180)};
setInterval(()=>{if(S.live){const d=new Date();S.h=d.getHours()+d.getMinutes()/60;apply()}},60000);
window.__setScene=(h,w)=>{manual();S.h=h;S.wx=w;apply()};
apply();live();
})();
